
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ số phường Lái Thiêu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#18324a;background:#f3f6fa}
header{background:#064b87;color:white;padding:18px}
header h2{margin:0 0 6px;font-size:22px}
header p{margin:0;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
button{border:0;border-radius:9px;padding:12px 15px;background:#e2eaf3;color:#163b5c;font-weight:bold;cursor:pointer}
button.active{background:#0878dc;color:white}
#map{height:70vh;min-height:420px;width:100%;background:#e5edf4}
.note{padding:12px;font-size:13px;color:#536579}
.leaflet-popup-content{min-width:190px}
.leaflet-popup-content button{margin-top:8px;background:#0878dc;color:white}
#boundaryStatus{padding:0 12px;font-size:13px;color:#536579}
</style>
</head>
<body>
<header>
<h2>BẢN ĐỒ SỐ PHƯỜNG LÁI THIÊU</h2>
<p>Di tích lịch sử – văn hóa · Tuyến đường số </p>
</header>

<div class="toolbar">
<button id="all" class="active" onclick="showLayer('all')">Tất cả</button>
<button id="heritage" onclick="showLayer('heritage')">🏛 Di tích</button>
<button id="qr" onclick="showLayer('qr')">▦ Điểm QR</button>
<button onclick="showWholeWard()">📍 Toàn cảnh phường</button>
</div>

<div id="map"></div>
<div id="boundaryStatus">Đang tải ranh giới phường Lái Thiêu...</div>
<div class="note">
Ranh giới lấy từ dữ liệu địa giới hành chính năm 2025.
Các ghim di tích và QR hiện vẫn là vị trí minh họa, cần xác minh trước khi công bố.
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([10.906,106.704],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,
 attribution:'© OpenStreetMap contributors'
}).addTo(map);

// Ranh giới hành chính phường Lái Thiêu
let boundaryLayer = null;
let wardBounds = null;

fetch('./lai-thieu.geojson')
 .then(response => {
   if (!response.ok) throw new Error('Không tải được file GeoJSON');
   return response.json();
 })
 .then(data => {
   // Chỉ lấy đối tượng đúng tên phường Lái Thiêu
   const wardFeatures = (data.features || []).filter(feature =>
     feature.properties &&
     feature.properties.a03_ten === 'Phường Lái Thiêu'
   );

   if (!wardFeatures.length) {
     throw new Error('Không tìm thấy đối tượng Phường Lái Thiêu');
   }

   boundaryLayer = L.geoJSON(wardFeatures, {
     style: {
       color: '#ffcc00',
       weight: 4,
       opacity: 1,
       fillColor: '#7c4dff',
       fillOpacity: 0.13
     },
     onEachFeature: (feature, layer) => {
       layer.bindPopup(
         '<b>Phường Lái Thiêu</b><br>' +
         'Diện tích: ' +
         (feature.properties.a07_dt || 'Chưa có') +
         ' km²<br>' +
         'Địa giới hành chính năm 2025'
       );
     }
   }).addTo(map);

   wardBounds = boundaryLayer.getBounds();

   if (wardBounds.isValid()) {
     map.fitBounds(wardBounds, {padding:[20,20]});
   }

   document.getElementById('boundaryStatus').textContent =
     'Đã tải đường ranh giới phường Lái Thiêu.';
 })
 .catch(error => {
   console.error(error);
   document.getElementById('boundaryStatus').textContent =
     'Chưa tải được ranh giới. Kiểm tra file lai-thieu.geojson đã nằm cùng thư mục với index.html chưa.';
 });

const heritageLayer=L.layerGroup().addTo(map);
const qrLayer=L.layerGroup().addTo(map);
fetch('./di-tich.json')
  .then(response => {
    if (!response.ok) throw new Error('Không tải được dữ liệu');
    return response.json();
  })
  .then(sites => {
    sites.forEach(site => {
      const marker = L.marker([site.lat, site.lon])
        .addTo(heritageLayer);

      const imageHTML = site.image
        ? `<img src="./${site.image}"
            alt="${site.name}"
            style="width:100%;height:155px;object-fit:cover;
            border-radius:10px;margin-bottom:9px"
            onerror="this.style.display='none'">`
        : '';

      const vrHTML = site.vr360
        ? `<a href="${site.vr360}" target="_blank"
            rel="noopener"
            style="display:block;text-align:center;
            background:#16834a;color:white;padding:10px;
            border-radius:8px;text-decoration:none;margin-top:8px">
            Tham quan 360°
          </a>`
        : '';

      marker.bindPopup(`
        <div style="width:230px;max-width:100%">
          ${imageHTML}
          <h3 style="margin:3px 0 8px;color:#064b87">
            ${site.name}
          </h3>
          <p style="font-size:13px;line-height:1.5">
            ${site.description}
          </p>
          <a href="${site.directions}" target="_blank"
             rel="noopener"
             style="display:block;text-align:center;
             background:#0878dc;color:white;padding:10px;
             border-radius:8px;text-decoration:none;font-weight:bold">
             Chỉ đường
          </a>
          ${vrHTML}
        </div>
      `);
    });
  })
  .catch(error => {
    console.error(error);
    document.getElementById('boundaryStatus').textContent =
      'Không tải được dữ liệu di tích. Kiểm tra file di-tich.json.';
  });
const qrPoints=[
{name:'Điểm QR tuyến đường số 1',lat:10.904,lon:106.706},
{name:'Điểm QR tuyến đường số 2',lat:10.911,lon:106.702}
];

qrPoints.forEach(point=>{
 const marker=L.circleMarker([point.lat,point.lon],{
  radius:9,color:'#0878dc',fillColor:'#42a5f5',fillOpacity:1
 }).addTo(qrLayer);
 marker.bindPopup('<b>'+point.name+'</b><p>Thay bằng vị trí QR thực tế.</p>');
});

function showLayer(which){
 ['all','heritage','qr'].forEach(id=>{
  document.getElementById(id).classList.toggle('active',id===which);
 });

 if(which==='all'||which==='heritage') map.addLayer(heritageLayer);
 else map.removeLayer(heritageLayer);

 if(which==='all'||which==='qr') map.addLayer(qrLayer);
 else map.removeLayer(qrLayer);

 // Luôn giữ đường ranh giới khi đổi lớp
 if(boundaryLayer && !map.hasLayer(boundaryLayer)){
   boundaryLayer.addTo(map);
 }
}

function showWholeWard(){
 if(boundaryLayer && wardBounds && wardBounds.isValid()){
   map.fitBounds(wardBounds,{padding:[20,20]});
 } else {
   alert('Ranh giới đang tải hoặc chưa tải được. Thử tải lại trang nhé.');
 }
}
</script>
</body>
</html>
